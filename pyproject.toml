[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obracaixa"
version = "3.4.0"
description = "Controle financeiro local para pequenas obras e empreiteiros (Tkinter)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.gui-scripts]
obracaixa = "obracaixa.app:main"

[tool.setuptools.packages.find]
where = ["src"]
